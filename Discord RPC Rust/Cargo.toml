[package]
name = "gts-rpc-gui"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
discord-rich-presence = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
